[package]
name = "citrus-port"
version = "1.1.0"
edition = "2024"
description = "A desktop serial port terminal built with Rust and Slint"
readme = "README.md"

[dependencies]
slint = "1.16.1"
serialport = "4"
crossbeam-channel = "0.5"
chrono = "0.4"
encoding_rs = "0.8"

[build-dependencies]
slint-build = "1.16.1"

[profile.release]
codegen-units = 1
lto = true
